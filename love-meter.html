<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Meter ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff7fb);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:650px;
    background:white;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(255,105,180,.2);
    z-index:2;
}

h1{
    color:#ff4d88;
    margin-bottom:15px;
}

p{
    color:#666;
    font-size:18px;
    margin-bottom:30px;
}

.progress{
    width:100%;
    height:28px;
    background:#ffe3ec;
    border-radius:30px;
    overflow:hidden;
    margin:25px 0;
}

.bar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#ff4d88,#ff85a2);
    border-radius:30px;
    transition:width .4s ease;
}

#percent{
    font-size:26px;
    font-weight:bold;
    color:#ff4d88;
    margin-top:10px;
}

#result{
    margin-top:30px;
    font-size:20px;
    color:#444;
    line-height:1.8;
    display:none;
}

button{
    display:none;
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff2f73;
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.hearts span{
    position:absolute;
    bottom:-60px;
    color:#ff5c8a;
    font-size:25px;
    animation:float 8s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:55%;animation-delay:1s;}
.hearts span:nth-child(5){left:70%;animation-delay:3s;}
.hearts span:nth-child(6){left:85%;animation-delay:5s;}

@keyframes float{
    0%{
        transform:translateY(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform:translateY(-110vh);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="hearts">
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
</div>

<div class="container">

    <h1>❤️ Love Meter ❤️</h1>

    <p>Calculating our love...</p>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

    <div id="percent">0%</div>

    <div id="result">
        <h2>❤️ Result ❤️</h2>

        <p>
            Love Level: <b>∞%</b><br><br>

            <span style="color:#ff4d88;">
                ⚠️ System Error
            </span><br>

            Your love has exceeded the measurable limit.<br><br>

            After several calculations, there's only one conclusion...
            <br><br>

            <b>I'm completely in love with you. ❤️</b>
        </p>
    </div>

    <button onclick="nextPage()">
        Continue ❤️
    </button>

</div>

<script>

let bar = document.getElementById("bar");
let percent = document.getElementById("percent");
let result = document.getElementById("result");
let button = document.querySelector("button");

let value = 0;

let loading = setInterval(function(){

    value++;

    bar.style.width = value + "%";
    percent.innerHTML = value + "%";

    if(value >= 100){

        clearInterval(loading);

        percent.innerHTML = "∞% ❤️";

        result.style.display = "block";

        button.style.display = "inline-block";

    }

},40);

function nextPage(){

    window.location.href = "adventure.html";

}

</script>

</body>
</html>
