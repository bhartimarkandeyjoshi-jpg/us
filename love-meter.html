```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Meter ❤️</title>


    <!-- Google Font -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        html {
            scroll-behavior: smooth;
        }


        /* =========================
           BODY
        ========================== */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff7fb
                );

            overflow-x: hidden;

            overflow-y: auto;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {

            width: 100%;

            max-width: 650px;

            background: white;

            padding: 45px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(255, 105, 180, 0.25);

            position: relative;

            z-index: 2;

            margin: auto;
        }


        /* =========================
           HEADING
        ========================== */

        h1 {

            color: #ff4d88;

            font-size: 34px;

            line-height: 1.3;

            margin-bottom: 15px;
        }


        /* =========================
           TEXT
        ========================== */

        .intro {

            color: #666;

            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* =========================
           PROGRESS BAR
        ========================== */

        .progress {

            width: 100%;

            height: 30px;

            background: #ffe5ef;

            border-radius: 50px;

            overflow: hidden;

            margin: 25px 0 15px;

            box-shadow:
                inset 0 2px 5px
                rgba(255, 77, 136, 0.12);
        }


        .bar {

            width: 0%;

            height: 100%;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    #ff4d88,
                    #ff8fb3
                );

            transition:
                width 0.15s ease;

            box-shadow:
                0 0 12px
                rgba(255, 77, 136, 0.4);
        }


        /* =========================
           PERCENTAGE
        ========================== */

        #percent {

            color: #ff4d88;

            font-size: 32px;

            font-weight: 700;

            margin: 15px 0 25px;
        }


        /* =========================
           RESULT
        ========================== */

        #result {

            display: none;

            margin-top: 25px;

            padding: 25px 20px;

            border-radius: 20px;

            background: #fff0f6;

            color: #555;

            font-size: 17px;

            line-height: 1.8;

            animation:
                fadeIn 0.7s ease;
        }


        #result h2 {

            color: #ff4d88;

            font-size: 25px;

            margin-bottom: 15px;
        }


        #result b {

            color: #ff4d88;
        }


        /* =========================
           BUTTON
        ========================== */

        button {

            width: auto;

            margin-top: 30px;

            padding: 15px 35px;

            border: none;

            border-radius: 40px;

            background: #ff4d88;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }


        button:hover {

            transform: scale(1.08);

            background: #ff2f73;
        }


        button:active {

            transform: scale(0.96);
        }


        /* =========================
           FLOATING HEARTS
        ========================== */

        .hearts {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }


        .hearts span {

            position: absolute;

            bottom: -60px;

            font-size: 25px;

            animation:
                float 8s linear infinite;
        }


        .hearts span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }


        .hearts span:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }


        .hearts span:nth-child(3) {
            left: 40%;
            animation-delay: 4s;
        }


        .hearts span:nth-child(4) {
            left: 60%;
            animation-delay: 1s;
        }


        .hearts span:nth-child(5) {
            left: 75%;
            animation-delay: 3s;
        }


        .hearts span:nth-child(6) {
            left: 90%;
            animation-delay: 5s;
        }


        /* =========================
           HEART ANIMATION
        ========================== */

        @keyframes float {

            0% {

                transform:
                    translateY(0);

                opacity: 0;
            }


            20% {

                opacity: 1;
            }


            100% {

                transform:
                    translateY(-110vh);

                opacity: 0;
            }
        }


        /* =========================
           RESULT ANIMATION
        ========================== */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }


            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 700px) {

            body {

                align-items: flex-start;

                padding: 20px 12px;
            }


            .container {

                width: 100%;

                margin: 20px auto;

                padding: 40px 28px;
            }


            h1 {

                font-size: 30px;
            }


            .intro {

                font-size: 17px;
            }

        }


        /* =========================
           PHONE
        ========================== */

        @media (max-width: 600px) {

            body {

                min-height: 100vh;

                align-items: flex-start;

                padding: 15px 10px;

                overflow-y: auto;
            }


            .container {

                width: 100%;

                margin: 15px auto;

                padding: 30px 18px;

                border-radius: 20px;
            }


            h1 {

                font-size: 25px;

                line-height: 1.4;

                margin-bottom: 12px;
            }


            .intro {

                font-size: 15px;

                line-height: 1.7;

                margin-bottom: 20px;
            }


            .progress {

                height: 24px;

                margin: 20px 0 12px;
            }


            #percent {

                font-size: 27px;

                margin: 12px 0 20px;
            }


            #result {

                margin-top: 20px;

                padding: 20px 15px;

                font-size: 15px;

                line-height: 1.75;
            }


            #result h2 {

                font-size: 22px;
            }


            button {

                width: 100%;

                margin-top: 22px;

                padding: 14px 18px;

                font-size: 16px;

                min-height: 50px;
            }


            .hearts span {

                font-size: 19px;
            }

        }


        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            body {

                padding: 10px 8px;
            }


            .container {

                padding: 25px 14px;

                margin: 10px auto;
            }


            h1 {

                font-size: 22px;
            }


            .intro {

                font-size: 14px;
            }


            .progress {

                height: 21px;
            }


            #percent {

                font-size: 25px;
            }


            #result {

                font-size: 14px;

                padding: 18px 12px;
            }


            #result h2 {

                font-size: 20px;
            }


            button {

                font-size: 15px;

                padding: 13px 15px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         FLOATING HEARTS
    ========================== -->

    <div class="hearts">

        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="container">


        <h1>
            ❤️ Love Meter ❤️
        </h1>


        <p class="intro">
            Calculating our love...
        </p>


        <!-- Progress Bar -->

        <div class="progress">

            <div
                class="bar"
                id="bar"
            ></div>

        </div>


        <!-- Percentage -->

        <div id="percent">
            0%
        </div>


        <!-- Result -->

        <div id="result">

            <h2>
                ❤️ Result ❤️
            </h2>


            <p>

                Love Level:
                <b>∞%</b>

                <br><br>


                <span style="color:#ff4d88;">
                    ⚠️ System Error
                </span>

                <br>


                Your love has exceeded
                the measurable limit.

                <br><br>


                After several calculations,
                there's only one conclusion...

                <br><br>


                <b>
                    I'm completely in love with you. ❤️
                </b>

            </p>

        </div>


        <!-- Continue Button -->

        <button onclick="nextPage()">

            Continue ❤️

        </button>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const bar =
            document.getElementById("bar");


        const percent =
            document.getElementById("percent");


        const result =
            document.getElementById("result");


        let value = 0;


        /* =========================
           LOVE METER ANIMATION
        ========================== */

        const timer =
            setInterval(() => {

                value++;

                bar.style.width =
                    value + "%";

                percent.innerHTML =
                    value + "%";


                if (value >= 100) {

                    clearInterval(timer);


                    setTimeout(() => {

                        result.style.display =
                            "block";

                    }, 500);

                }

            }, 35);


        /* =========================
           NEXT PAGE
        ========================== */

        function nextPage() {

            window.location.href =
                "time.html";

        }

    </script>


</body>

</html>
