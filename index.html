<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff7fb);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:650px;
    background:white;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 35px rgba(255,105,180,.2);
    z-index:2;
}

h3{
    color:#ff4d88;
    font-size:28px;
    margin-bottom:10px;
}

h1{
    color:#333;
    margin-bottom:20px;
}

p{
    color:#666;
    line-height:1.8;
    font-size:18px;
}

button{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff2f73;
}

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

.hearts span{
    position:absolute;
    bottom:-60px;
    color:#ff5c8a;
    font-size:25px;
    animation:float 8s linear infinite;
}

.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:55%;animation-delay:1s;}
.hearts span:nth-child(5){left:70%;animation-delay:3s;}
.hearts span:nth-child(6){left:85%;animation-delay:5s;}

@keyframes float{
0%{
transform:translateY(0);
opacity:0;
}
20%{
opacity:1;
}
100%{
transform:translateY(-110vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="hearts">
<span>❤️</span>
<span>❤️</span>
<span>❤️</span>
<span>❤️</span>
<span>❤️</span>
<span>❤️</span>
</div>

<div class="container">

<h3>Hey Handsome ❤️</h3>

<h1>I Made Something Just For You</h1>

<p>
This isn't a birthday surprise...<br><br>

It's just a little reminder that no matter how many days pass,
I'll always find new reasons to love you. ❤️<br><br>

Now come with me...
I have something to show you.
</p>

<button onclick="nextPage()">
Open My Heart ❤️
</button>

</div>

<script>
function nextPage(){
    window.location.href="love-meter.html";
}
</script>

</body>
</html>
