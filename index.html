<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For My Love ❤️</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #fff7fb
            );

            overflow-x: hidden;
            overflow-y: auto;

            padding: 30px 15px;
        }

        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            width: 100%;
            max-width: 650px;

            background: white;

            padding: 50px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 35px rgba(255, 105, 180, 0.2);

            position: relative;
            z-index: 2;

            margin: auto;
        }

        /* =========================
           HEADINGS
        ========================== */

        h3 {
            color: #ff4d88;
            font-size: 28px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;

            font-size: 32px;

            line-height: 1.3;

            margin-bottom: 20px;
        }

        /* =========================
           PARAGRAPH
        ========================== */

        p {
            color: #666;

            line-height: 1.8;

            font-size: 18px;
        }

        /* =========================
           BUTTON
        ========================== */

        button {
            margin-top: 35px;

            padding: 15px 35px;

            border: none;

            border-radius: 40px;

            background: #ff4d88;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }

        button:hover {
            transform: scale(1.08);

            background: #ff2f73;
        }

        button:active {
            transform: scale(0.96);
        }

        /* =========================
           FLOATING HEARTS
        ========================== */

        .hearts {
            position: fixed;

            width: 100%;
            height: 100%;

            top: 0;
            left: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }

        .hearts span {
            position: absolute;

            bottom: -60px;

            color: #ff5c8a;

            font-size: 25px;

            animation: float 8s linear infinite;
        }

        .hearts span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .hearts span:nth-child(2) {
            left: 20%;
            animation-delay: 2s;
        }

        .hearts span:nth-child(3) {
            left: 35%;
            animation-delay: 4s;
        }

        .hearts span:nth-child(4) {
            left: 50%;
            animation-delay: 1s;
        }

        .hearts span:nth-child(5) {
            left: 65%;
            animation-delay: 3s;
        }

        .hearts span:nth-child(6) {
            left: 75%;
            animation-delay: 5s;
        }

        .hearts span:nth-child(7) {
            left: 85%;
            animation-delay: 2.5s;
        }

        .hearts span:nth-child(8) {
            left: 95%;
            animation-delay: 4.5s;
        }

        /* =========================
           HEART ANIMATION
        ========================== */

        @keyframes float {

            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    scale(1.2);

                opacity: 0;
            }
        }

        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 600px) {

            body {
                min-height: 100vh;

                padding: 20px 12px;

                align-items: flex-start;

                overflow-y: auto;
            }

            .container {
                width: 100%;

                padding: 35px 22px;

                margin-top: 20px;
                margin-bottom: 20px;

                border-radius: 20px;
            }

            h3 {
                font-size: 23px;

                margin-bottom: 12px;
            }

            h1 {
                font-size: 25px;

                line-height: 1.35;

                margin-bottom: 18px;
            }

            p {
                font-size: 16px;

                line-height: 1.7;
            }

            button {
                width: 100%;

                padding: 14px 20px;

                font-size: 16px;

                margin-top: 28px;
            }

            .hearts span {
                font-size: 20px;
            }
        }

        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            body {
                padding: 15px 10px;
            }

            .container {
                padding: 30px 18px;
            }

            h3 {
                font-size: 21px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 15px;
            }

            button {
                font-size: 15px;

                padding: 13px 18px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         FLOATING HEARTS
    ========================== -->

    <div class="hearts">

        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="container">

        <h3>
            Hey Handsome ❤️
        </h3>

        <h1>
            I Made Something Just For You
        </h1>

        <p>

            This isn't a birthday surprise...

            <br><br>

            It's just a little reminder that no matter
            how many days pass, I'll always find new
            reasons to love you. ❤️

            <br><br>

            Now come with me...

            <br>

            I have something to show you.

        </p>


        <!-- BUTTON -->

        <button onclick="nextPage()">
            Open My Heart ❤️
        </button>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function nextPage() {

            window.location.href = "love-meter.html";

        }

    </script>

</body>
</html>
