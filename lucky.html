<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>How Lucky Am I? 🍀❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fff1c9,#ffe0eb);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:650px;
    background:white;
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(255,105,180,.25);
    z-index:2;
}

h1{
    color:#ff4d88;
    margin-bottom:15px;
}

p{
    color:#666;
    font-size:18px;
    line-height:1.8;
}


#loading{
    margin-top:30px;
    font-size:22px;
    color:#ff4d88;
    font-weight:600;
}


.progress{
    width:100%;
    height:25px;
    background:#ffe3ec;
    border-radius:30px;
    margin:25px 0;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff4d88,#ffb703);
    border-radius:30px;
    transition:.4s;
}


#result{
    display:none;
    margin-top:25px;
    font-size:22px;
    color:#444;
}


button{
    display:none;
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}


button:hover{
    transform:scale(1.08);
    background:#ff2f73;
}


/* Floating hearts */

.hearts{
    position:absolute;
    height:100%;
    width:100%;
    overflow:hidden;
}


.hearts span{
    position:absolute;
    bottom:-60px;
    color:#ff6b9a;
    font-size:25px;
    animation:float 8s linear infinite;
}


.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:60%;animation-delay:1s;}
.hearts span:nth-child(5){left:75%;animation-delay:3s;}
.hearts span:nth-child(6){left:90%;animation-delay:5s;}


@keyframes float{

0%{
    transform:translateY(0);
    opacity:0;
}

20%{
    opacity:1;
}

100%{
    transform:translateY(-110vh);
    opacity:0;
}

}
</style>
</head>

<body>

<div class="hearts">
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
    <span>❤️</span>
</div>


<div class="container">

    <h1>🍀 How Lucky Am I? ❤️</h1>

    <p>
        Let's calculate my luck...
        <br>
        (Warning: the answer may be too cute 😌)
    </p>


    <div id="loading">
        Starting calculation...
    </div>


    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>


    <div id="percent">
        0%
    </div>


    <div id="result">

        🍀 <b>Result Found</b> 🍀

        <br><br>

        Luck Level:
        <br>

        <span style="color:#ff4d88;font-size:30px;">
            ∞ / 10 ❤️
        </span>

        <br><br>

        Because I have the most amazing person in my life.

        <br><br>

        My biggest luck isn't winning anything...

        <br>

        It's having you. ❤️

    </div>


    <button id="nextBtn" onclick="nextPage()">
        Continue ❤️
    </button>


</div>


<script>

let bar = document.getElementById("bar");
let percent = document.getElementById("percent");
let loading = document.getElementById("loading");
let result = document.getElementById("result");
let nextBtn = document.getElementById("nextBtn");

let value = 0;


let messages = [
    "Checking luck...",
    "Searching memories...",
    "Counting smiles...",
    "Analyzing happiness...",
    "Almost done..."
];


let interval = setInterval(function(){

    value++;

    bar.style.width = value + "%";
    percent.innerHTML = value + "%";


    if(value % 20 === 0){
        loading.innerHTML = messages[(value/20)-1];
    }


    if(value >= 100){

        clearInterval(interval);


        loading.innerHTML = "Calculation Complete ❤️";

        percent.innerHTML = "∞%";


        result.style.display="block";

        nextBtn.style.display="inline-block";

    }


},50);



function nextPage(){

    window.location.href="countdown.html";

}

</script>


</body>
</html>
