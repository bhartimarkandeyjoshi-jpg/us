<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Time Together ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffe0eb,#fff7fb);
    overflow:hidden;
}

.container{
    width:90%;
    max-width:700px;
    background:white;
    padding:45px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(255,105,180,.25);
    z-index:2;
}

h1{
    color:#ff4d88;
    margin-bottom:15px;
}

.subtitle{
    color:#666;
    font-size:18px;
    margin-bottom:30px;
}


.countdown{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin:25px 0;
}


.box{
    background:#ffedf3;
    width:120px;
    padding:20px 10px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(255,77,136,.15);
}


.number{
    font-size:35px;
    font-weight:700;
    color:#ff4d88;
}


.label{
    color:#666;
    font-size:15px;
}


.message{
    margin-top:25px;
    color:#555;
    font-size:18px;
    line-height:1.8;
}


button{
    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#ff4d88;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}


button:hover{
    transform:scale(1.08);
    background:#ff2f73;
}


/* Floating hearts */

.hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}


.hearts span{
    position:absolute;
    bottom:-60px;
    color:#ff6b9a;
    font-size:25px;
    animation:float 8s linear infinite;
}


.hearts span:nth-child(1){left:10%;animation-delay:0s;}
.hearts span:nth-child(2){left:25%;animation-delay:2s;}
.hearts span:nth-child(3){left:40%;animation-delay:4s;}
.hearts span:nth-child(4){left:60%;animation-delay:1s;}
.hearts span:nth-child(5){left:75%;animation-delay:3s;}
.hearts span:nth-child(6){left:90%;animation-delay:5s;}


@keyframes float{

0%{
    transform:translateY(0);
    opacity:0;
}

20%{
    opacity:1;
}

100%{
    transform:translateY(-110vh);
    opacity:0;
}

}
<script>

const startDate = new Date("2024-11-20T00:00:00");


function updateTime(){

    let now = new Date();

    let difference = now - startDate;


    let seconds = Math.floor(difference / 1000);

    let minutes = Math.floor(seconds / 60);

    let hours = Math.floor(minutes / 60);

    let days = Math.floor(hours / 24);


    let years = Math.floor(days / 365);

    let months = Math.floor((days % 365) / 30);

    let remainingDays = days % 30;


    document.getElementById("years").innerHTML = years;

    document.getElementById("months").innerHTML = months;

    document.getElementById("days").innerHTML = remainingDays;

    document.getElementById("hours").innerHTML = hours % 24;

    document.getElementById("minutes").innerHTML = minutes % 60;

    document.getElementById("seconds").innerHTML = seconds % 60;

}


setInterval(updateTime,1000);

updateTime();



function nextPage(){

    window.location.href="letter.html";

}

</script>
