<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Choose Your Adventure ❤️</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           BASIC RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #fff7fb
            );

            overflow-x: hidden;
            overflow-y: auto;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {
            width: 100%;
            max-width: 650px;

            background: white;

            padding: 45px 40px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 35px rgba(255, 105, 180, 0.2);

            position: relative;
            z-index: 2;
        }


        /* =========================
           HEADING
        ========================== */

        h1 {
            color: #ff4d88;

            font-size: 32px;

            line-height: 1.3;

            margin-bottom: 20px;
        }


        /* =========================
           SUBTITLE
        ========================== */

        .subtitle {
            color: #666;

            font-size: 18px;

            line-height: 1.8;

            margin-bottom: 30px;
        }


        /* =========================
           CHOICES
        ========================== */

        .choice {
            display: flex;

            flex-direction: column;

            gap: 15px;

            width: 100%;
        }


        .choice button {
            width: 100%;

            padding: 15px 20px;

            border: none;

            border-radius: 40px;

            background: #ff4d88;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }


        .choice button:hover {
            background: #ff2f73;

            transform: scale(1.03);
        }


        .choice button:active {
            transform: scale(0.97);
        }


        /* =========================
           ANSWER BOX
        ========================== */

        #answer {
            display: none;

            margin-top: 30px;

            padding: 25px 20px;

            border-radius: 20px;

            background: #fff0f6;

            color: #ff4d88;

            font-size: 17px;

            line-height: 1.7;

            animation: fadeIn 0.6s ease;
        }


        /* =========================
           CONTINUE BUTTON
        ========================== */

        .next {
            display: none;

            width: 100%;

            margin-top: 25px;

            padding: 15px 25px;

            border: none;

            border-radius: 40px;

            background: #ff4d88;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }


        .next:hover {
            background: #ff2f73;

            transform: scale(1.05);
        }


        .next:active {
            transform: scale(0.97);
        }


        /* =========================
           FLOATING HEARTS
        ========================== */

        .hearts {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }


        .hearts span {
            position: absolute;

            bottom: -60px;

            font-size: 24px;

            animation: float 8s linear infinite;
        }


        .hearts span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }

        .hearts span:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }

        .hearts span:nth-child(3) {
            left: 40%;
            animation-delay: 4s;
        }

        .hearts span:nth-child(4) {
            left: 55%;
            animation-delay: 1s;
        }

        .hearts span:nth-child(5) {
            left: 70%;
            animation-delay: 3s;
        }

        .hearts span:nth-child(6) {
            left: 85%;
            animation-delay: 5s;
        }


        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes float {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 700px) {

            body {
                align-items: flex-start;

                padding: 25px 15px;
            }

            .container {
                margin: 20px auto;

                padding: 40px 30px;
            }

            h1 {
                font-size: 29px;
            }

        }


        /* =========================
           PHONE
        ========================== */

        @media (max-width: 600px) {

            body {
                min-height: 100vh;

                padding: 15px 10px;

                align-items: flex-start;
            }


            .container {
                width: 100%;

                margin: 15px auto;

                padding: 30px 20px;

                border-radius: 20px;
            }


            h1 {
                font-size: 24px;

                line-height: 1.4;

                margin-bottom: 15px;
            }


            .subtitle {
                font-size: 15px;

                line-height: 1.7;

                margin-bottom: 25px;
            }


            .choice {
                gap: 12px;
            }


            .choice button {
                padding: 14px 15px;

                font-size: 15px;

                min-height: 50px;
            }


            #answer {
                margin-top: 25px;

                padding: 20px 15px;

                font-size: 15px;

                line-height: 1.7;
            }


            .next {
                margin-top: 20px;

                padding: 14px 20px;

                font-size: 15px;

                min-height: 50px;
            }


            .hearts span {
                font-size: 19px;
            }

        }


        /* =========================
           SMALL PHONE
        ========================== */

        @media (max-width: 380px) {

            body {
                padding: 10px 8px;
            }


            .container {
                padding: 25px 15px;

                margin: 10px auto;
            }


            h1 {
                font-size: 21px;
            }


            .subtitle {
                font-size: 14px;
            }


            .choice button {
                font-size: 14px;

                padding: 13px 12px;
            }


            #answer {
                font-size: 14px;

                padding: 18px 12px;
            }


            .next {
                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         FLOATING HEARTS
    ========================== -->

    <div class="hearts">

        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>

    </div>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="container">


        <h1>
            ❤️ Choose Your Adventure ❤️
        </h1>


        <p class="subtitle">

            If we were together right now...

            <br>

            what would you choose first? 🥰

        </p>


        <div class="choice">


            <button onclick="choose()">
                🤗 Give me a hug
            </button>


            <button onclick="choose()">
                💋 Give me a kiss
            </button>


            <button onclick="choose()">
                🫂 Cuddle with me
            </button>


        </div>


        <div id="answer">

            ❤️ Correct Choice ❤️

            <br><br>

            Actually...

            <br>

            I want all of them. 😌

            <br><br>

            Because every moment with you
            becomes my favorite moment.

        </div>


        <button
            class="next"
            id="nextBtn"
            onclick="nextPage()"
        >
            Continue ❤️
        </button>


    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        function choose() {

            document.getElementById("answer").style.display = "block";

            document.getElementById("nextBtn").style.display = "block";

        }


        function nextPage() {

            window.location.href = "next-page.html";

        }

    </script>


</body>

</html>
