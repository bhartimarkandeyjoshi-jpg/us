<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>To My Babyyy Shivam ❤️</title>

<link
href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:30px 15px;

    overflow-x:hidden;
    overflow-y:auto;

    font-family:'Poppins',sans-serif;

    background:
    radial-gradient(circle at 15% 20%,#ffd1e2,transparent 35%),
    radial-gradient(circle at 85% 80%,#ffe0eb,transparent 35%),
    linear-gradient(135deg,#fff0f6,#fffafd);
}

.container {

    width:100%;
    max-width:750px;

    background:
    linear-gradient(
        rgba(255,255,255,.96),
        rgba(255,250,252,.96)
    );

    padding:50px 45px;

    border-radius:30px;

    box-shadow:
    0 20px 70px rgba(255,77,136,.2);

    position:relative;
}

.top-heart {

    text-align:center;

    font-size:35px;

    margin-bottom:10px;

    animation:beat 1.5s infinite;
}

@keyframes beat {

    0%,100% {
        transform:scale(1);
    }

    50% {
        transform:scale(1.15);
    }
}

h1 {

    text-align:center;

    font-family:'Great Vibes',cursive;

    color:#d9366d;

    font-size:58px;

    line-height:1.2;

    margin-bottom:5px;
}

.subtitle {

    text-align:center;

    color:#ff6b9a;

    font-size:14px;

    letter-spacing:2px;

    margin-bottom:30px;
}

.line {

    width:100px;

    height:2px;

    margin:0 auto 35px;

    background:
    linear-gradient(
        to right,
        transparent,
        #ff7fa8,
        transparent
    );
}

#letter {

    color:#5f5f5f;

    font-size:17px;

    line-height:2;

    white-space:pre-line;

    overflow-wrap:break-word;
}

.signature {

    text-align:right;

    font-family:'Great Vibes',cursive;

    color:#d9366d;

    font-size:38px;

    margin-top:30px;
}

#finishBtn {

    display:none;

    width:100%;

    margin-top:35px;

    padding:16px;

    border:none;

    border-radius:50px;

    background:
    linear-gradient(135deg,#ff4d88,#ff709f);

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    box-shadow:0 10px 25px rgba(255,77,136,.25);
}

@media(max-width:600px) {

    body {
        padding:15px 10px;
    }

    .container {
        margin:10px auto;
        padding:35px 20px;
        border-radius:25px;
    }

    h1 {
        font-size:43px;
    }

    .subtitle {
        font-size:11px;
    }

    #letter {
        font-size:15px;
        line-height:1.9;
    }

    .signature {
        font-size:32px;
    }

    #finishBtn {
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="top-heart">
        ❤️
    </div>

    <h1>
        To My Babyyy Shivam
    </h1>

    <div class="subtitle">
        THE BOY WHO HAS MY WHOLE HEART
    </div>

    <div class="line"></div>

    <div id="letter"></div>

    <div
        class="signature"
        id="signature"
        style="display:none;"
    >
        Always yours... ❤️
    </div>

    <button
        id="finishBtn"
        onclick="showLove()"
    >
        One Last Surprise ❤️
    </button>

</div>

<script>

const text = `My Babyyy Shivam,

I don't even know where to begin...

Because somehow, whenever I try to put my feelings for you into words, the words always feel too small. ❤️

You have become such a beautiful part of my life.

Not just someone I love...

but someone I look for in my good moments, my bad moments, my random thoughts, my silly conversations and even in the quiet moments when I don't say anything.

You have this little way of making ordinary days feel special.

And honestly, Shivam...

I hope you know how deeply you are loved.

I love your presence.
I love our conversations.
I love the little moments that probably seem ordinary but somehow stay in my heart.

I love knowing that somewhere in this huge world, there is YOU.

My person.
My comfort.
My favorite notification.
My favorite thought.
My favorite "what if we..." person. 🥹❤️

I don't know what the future has planned for us.

But if I get a choice...

I want more memories with you.

More laughs until our stomachs hurt.
More late-night conversations.
More random pictures.
More silly fights.
More "I miss you."
More hugs that last a little too long.
More moments where we look at each other and forget what we were even talking about.

And if someday we look back at this little website...

I hope we smile and remember how much love was hiding inside these tiny pages.

Shivam...

Thank you for being you.

Thank you for existing in my life.

And thank you for giving my heart someone so beautiful to choose.

If I had to choose again...

among every person,
every place,
every possibility...

I would still choose you.

Again.

And again.

And again.

Always. ❤️`;

let index = 0;

const letter =
document.getElementById("letter");

function typeLetter() {

    if(index < text.length) {

        letter.innerHTML +=
            text.charAt(index);

        index++;

        setTimeout(typeLetter,28);

    } else {

        document.getElementById("signature")
            .style.display="block";

        document.getElementById("finishBtn")
            .style.display="block";
    }
}

typeLetter();

function showLove() {

    window.location.href="lucky.html";

}

</script>

</body>
</html>
