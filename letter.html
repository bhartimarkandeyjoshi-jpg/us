```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Heart For You ❤️</title>


    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }


        html {
            scroll-behavior: smooth;
        }


        /* =========================
           BODY
        ========================== */

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #ffd6e7,
                    #fff7fb
                );

            overflow-x: hidden;

            overflow-y: auto;

            padding: 25px 15px;
        }


        /* =========================
           MAIN CONTAINER
        ========================== */

        .container {

            width: 100%;

            max-width: 700px;

            background: white;

            padding: 45px;

            border-radius: 25px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(255, 105, 180, 0.25);

            position: relative;

            z-index: 2;

            margin: auto;
        }


        /* =========================
           HEADING
        ========================== */

        .glow {

            color: #ff4d88;

            font-size: 36px;

            line-height: 1.3;

            margin-bottom: 30px;

            text-shadow:
                0 0 5px #ffb3ca,
                0 0 10px #ff8fb0,
                0 0 20px #ff6b9a;

            animation: glow 2s ease-in-out infinite alternate;
        }


        @keyframes glow {

            from {
                text-shadow:
                    0 0 5px #ffb3ca,
                    0 0 10px #ff8fb0;
            }

            to {
                text-shadow:
                    0 0 10px #ff8fb0,
                    0 0 25px #ff6b9a;
            }
        }


        /* =========================
           LETTER
        ========================== */

        #letter {

            color: #555;

            font-size: 18px;

            line-height: 1.9;

            text-align: left;

            min-height: 100px;

            white-space: pre-line;

            word-wrap: break-word;

            overflow-wrap: break-word;

            padding: 10px 5px;
        }


        /* =========================
           BUTTON
        ========================== */

        #finishBtn {

            margin-top: 30px;

            padding: 15px 35px;

            border: none;

            border-radius: 40px;

            background: #ff4d88;

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.3s ease;

            -webkit-tap-highlight-color: transparent;
        }


        #finishBtn:hover {

            transform: scale(1.08);

            background: #ff2f73;
        }


        #finishBtn:active {

            transform: scale(0.96);
        }


        /* =========================
           FLOATING HEARTS
        ========================== */

        .hearts {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }


        .hearts span {

            position: absolute;

            bottom: -60px;

            font-size: 25px;

            animation:
                float 8s linear infinite;
        }


        .hearts span:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
        }


        .hearts span:nth-child(2) {
            left: 25%;
            animation-delay: 2s;
        }


        .hearts span:nth-child(3) {
            left: 40%;
            animation-delay: 4s;
        }


        .hearts span:nth-child(4) {
            left: 60%;
            animation-delay: 1s;
        }


        .hearts span:nth-child(5) {
            left: 75%;
            animation-delay: 3s;
        }


        .hearts span:nth-child(6) {
            left: 90%;
            animation-delay: 5s;
        }


        /* =========================
           HEART ANIMATION
        ========================== */

        @keyframes float {

            0% {
                transform: translateY(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }


        /* =========================
           TABLET
        ========================== */

        @media (max-width: 700px) {

            body {

                align-items: flex-start;

                padding: 20px 12px;
            }


            .container {

                margin: 20px auto;

                padding: 40px 28px;
            }


            .glow {

                font-size: 31px;
            }


            #letter {

                font-size: 17px;

                line-height: 1.8;
            }

        }


        /* =========================
           PHONE
        ========================== */

        @media (max-width: 600px) {

            body {

                min-height: 100vh;

                align-items: flex-start;

                padding: 15px 10px;

                overflow-y: auto;
            }


            .container {

                width: 100%;

                margin: 15px auto;

                padding: 30px 18px;

                border-radius: 20px;
            }


            .glow {

                font-size: 24px;

                line-height: 1.4;

                margin-bottom: 20px;
            }


            #letter {

                font-size: 15px;

                line-height: 1.8;

                text-align: left;

                padding: 5px 0;
            }


            #finishBtn {

                width: 100%;

                margin-top: 25px;

                padding: 14px 18px;

                font-size: 16px;

                min-height: 50px;
            }


            .hearts span {

                font-size: 19px;
            }

        }


        /* =========================
           SMALL PHONES
        ========================== */

        @media (max-width: 380px) {

            body {

                padding: 10px 8px;
            }


            .container {

                padding: 25px 15px;

                margin: 10px auto;
            }


            .glow {

                font-size: 21px;
            }


            #letter {

                font-size: 14px;

                line-height: 1.75;
            }


            #finishBtn {

                font-size: 15px;

                padding: 13px 15px;
            }

        }

    </style>

</head>


<body>


    <!-- Floating Hearts -->

    <div class="hearts">

        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>
        <span>❤️</span>

    </div>


    <!-- Main Content -->

    <div class="container">


        <h1 class="glow">
            My Heart For You ❤️
        </h1>


        <div id="letter"></div>


        <button
            id="finishBtn"
            onclick="showLove()"
        >
            One Last Surprise ❤️
        </button>


    </div>


    <script>

        /* =========================
           LETTER TEXT
        ========================== */

        const text = `My love ❤️

I don't know if words will ever be enough to explain what you mean to me.

You have become such a beautiful part of my life, and every moment with you is something I treasure deeply.

From the smallest conversations to the biggest memories, everything feels a little more special because you're in my life.

I don't promise that every day will be perfect.

But I do promise that I'll always try to make you smile, stand beside you, and remind you how loved you are.

Thank you for being you.

And if I had to choose all over again...

I would still choose you. ❤️`;


        /* =========================
           TYPING EFFECT
        ========================== */

        let index = 0;

        const letter =
            document.getElementById("letter");


        function typeLetter() {

            if (index < text.length) {

                letter.innerHTML +=
                    text.charAt(index);

                index++;

                setTimeout(
                    typeLetter,
                    35
                );

            }

        }


        typeLetter();


        /* =========================
           FINAL SURPRISE
        ========================== */

        function showLove() {

            alert(
                "I LOVE YOU ❤️🥹"
            );

        }

    </script>


</body>

</html>
```
