<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Letter To Shivam ❤️</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg,#ffdce9,#fff8fb,#ffeaf2);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px 15px;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: rgba(255,255,255,.96);
            padding: 45px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(255,77,136,.22);
            text-align: center;
            margin: 15px auto;
            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #ff4d88;
            font-size: 34px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        #letter {
            text-align: left;
            color: #555;
            font-size: 17px;
            line-height: 2;
            white-space: pre-line;
            min-height: 200px;
        }

        .cursor {
            display: inline-block;
            color: #ff4d88;
            animation: blink .8s infinite;
            font-weight: 700;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        #finishBtn {
            display: none;
            margin-top: 35px;
            padding: 16px 30px;
            border-radius: 50px;
            background: linear-gradient(135deg,#ff4d88,#ff729f);
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(255,77,136,.28);
            transition: .3s;
        }

        #finishBtn:hover {
            transform: scale(1.04);
        }

        .bottom-heart {
            margin-top: 25px;
            color: #ff4d88;
            font-size: 24px;
        }

        @media(max-width:600px) {
            body {
                padding: 12px 10px;
            }

            .container {
                padding: 32px 20px;
                margin: 10px auto;
            }

            h1 {
                font-size: 27px;
            }

            #letter {
                font-size: 15px;
                line-height: 1.9;
            }

            #finishBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>
            My Baby Shivam,
            <br>
            My Heart For You ❤️
        </h1>

        <div id="letter"></div>

        <div class="bottom-heart">
            ❤️ 🥹 ❤️
        </div>

        <a href="./lucky.html" id="finishBtn">
            One Last Surprise ❤️
        </a>

    </div>

    <script>

        const message = `
My baby Shivam... ❤️

I don't even know where to begin because there are so many things I want to tell you.

You came into my life and somehow made ordinary moments feel special.

A simple conversation with you can make my entire day better.

Your presence feels like comfort.
Your smile feels like sunshine.
And your hugs... honestly, I could live inside them. 🥹❤️

I don't need a perfect love story.

I just want our story.

The silly conversations.
The random laughs.
The little arguments.
The "I miss you" messages.
The late-night talks.
The quiet moments where we don't even need words.

I want all of it.

Because it's with you.

Shivam, if I could give you one thing in this world, I would give you the ability to see yourself through my eyes.

Then you'd understand just how incredibly special you are to me.

You are not just someone I love.

You are someone I choose.

Again and again.

Every single day.

And if life gave me the chance to start everything over...

I'd still look for you.

I'd still choose you.

I'd still fall for you.

And I'd still call you...

My baby. ❤️

So here's my little promise:

No matter how many days pass,
no matter how much life changes,
I'll always keep a soft little corner of my heart reserved just for you.

Thank you for being you.

Thank you for being my person.

And thank you for giving my heart
someone to love this much.

I love you, Shivam.

More than this little website could ever explain.

Always yours. ❤️
        `;

        const letter = document.getElementById("letter");
        const finishBtn = document.getElementById("finishBtn");

        let index = 0;

        function typeLetter() {

            if (index < message.length) {

                letter.innerHTML =
                    message.substring(0, index + 1)
                    .replace(/\n/g, "<br>") +
                    '<span class="cursor">|</span>';

                index++;

                setTimeout(typeLetter, 25);

            } else {

                letter.innerHTML =
                    message.replace(/\n/g, "<br>");

                setTimeout(() => {
                    finishBtn.style.display = "inline-block";
                }, 1200);
            }
        }

        typeLetter();

    </script>

</body>
</html>
